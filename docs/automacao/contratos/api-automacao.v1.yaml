        comunicação de resposta orientando o remetente — sem gravar arquivo. Mesma chave de
        idempotência de `/recebimentos`.
      operationId: criarRecebimentoSemArquivo
      x-origem: 10-6 E2
      x-escopos: [recebimentos:criar]
      x-desligamento: recusa
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
