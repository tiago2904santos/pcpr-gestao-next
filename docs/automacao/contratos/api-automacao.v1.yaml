openapi: 3.1.0
info:
  title: API de automação do PCPR (v1)
  version: 1.0.0-rascunho.3
  summary: CONTRATO NOVO — desenhado em 17/10/2026, ainda não implementado no sistema.
  description: |
    Revisão de escopo em 18/10/2026 (ADR 0046 e docs/product/automacao-whatsapp-testes.md):
    WhatsApp Cloud API é o canal principal do sistema de testes independente, sem uso oficial
    policial e sem operação com policiais. Começa desligado; LAB dedicado pode ligar após
    onboarding, contato verificado, opt-in, lista de testadores e ensaio ponta a ponta.
    PREVIEW/DEMO público permanece simulado. A revisão não implementa nem ativa a API real.

    Fachada estreita pela qual o orquestrador (n8n) e o assistente de IA falam com o PCPR, conforme
    ADR 0020: nada grava direto no banco; toda escrita passa pelos `services.py`, com as mesmas
    `policies.py`, outbox e auditoria das telas. O PCPR é dono do estado; o n8n transporta.

    **Rascunho 3 (17/10/2026).** Consolida as extensões pedidas pelos fluxos 10-1 a 13 e pelas fichas
    (AUT-NN). Cada operação, campo ou valor acrescentado neste rascunho traz `x-origem` com o fluxo ou a
    ficha que o pediu. Exemplos sintéticos em `exemplos/` (pessoas e números fictícios, domínio
    `.invalid`).

    ## Credenciais e autorização
    - Três tipos de credencial, todas `Authorization: Bearer`, guardadas só como hash no PCPR, com
      escopos, ambiente fixo, validade e rotação:
      1. **Token de serviço de transporte** (n8n): só escopos de transporte — `estado:ler`,
         `comunicacoes:ler`, `comunicacoes:reservar`, `comunicacoes:resultado`, `comunicacoes:entrega`,
         `recebimentos:criar`, `recebimentos:ler`, `entradas:criar`, `assistente:mensagens`,
         `excecoes:criar`. **Sem** `ferramentas:*`.
      2. **Token de serviço de IA** (só se um fluxo de IA pelo n8n for adotado: 11-1, alternativa D6
         do 11-2, 11-3): `ferramentas:executar` restrito à lista de ferramentas daquele fluxo
         (`x-ferramentas-permitidas` no cadastro do token) e **sempre** com `X-PCPR-Delegacao`.
      3. **Token pessoal** (clientes MCP, AUT-107): emitido pelo próprio usuário na tela (ou OAuth);
         age como esse usuário, com as policies dele. Não aceita `X-PCPR-Delegacao`.
    - Escopos exigidos por operação em `x-escopos`. Token ausente, inválido, revogado, vencido ou de
      outro ambiente → 401 `nao_autenticado`; escopo ausente ou policy negada → 403 `negado`.
    - **Não existe representação declarada pelo chamador.** O cabeçalho `X-PCPR-Usuario-Representado`
      do rascunho 2 foi retirado: qualquer portador de um token com esse poder escolheria o id de
      qualquer pessoa, inclusive de administrador (*confused deputy*), e a trilha mostraria o humano
      como autor. Agir em nome de alguém exige **delegação emitida pelo PCPR no momento da ação
      humana** (registro `Delegacao`: usuário, ferramentas, recurso, validade ≤ 15 min, uso único),
      referenciada por id opaco em `X-PCPR-Delegacao` (o evento ou o pedido carrega o id, nunca o
      usuário). A API confere: existe, não venceu, não foi usada, foi emitida para esta credencial, a
      ferramenta está na lista e o recurso é o mesmo. Delegação de usuário com papel administrativo
      ou visão de todas as unidades por token de serviço é recusada (403 `negado`).

    ## Idempotência
    - Todo POST exige `Idempotency-Key`. Repetir a mesma chave com a mesma requisição devolve a mesma
      resposta, sem efeito novo, com `Idempotency-Replayed: true`. Mesma chave com outra requisição →
      422 `entrada_invalida` (exceção: `/recebimentos`, ver a operação).
    - A "mesma requisição" é comparada por impressão: corpo JSON canônico; em multipart, os campos +
      SHA-256 de cada arquivo, nunca os bytes do corpo (o separador muda a cada reenvio — achado do
      protótipo, T9).
    - São guardadas as respostas 2xx e 409 (desfechos de negócio). **423 não é guardado** (nada
      aconteceu; repetir depois de religar deve funcionar — validado no protótipo). 400, 401, 403, 422,
      429 e 5xx também não são guardados.
    - Exceção deliberada: a reserva usa chave **única por tentativa** (ver `/comunicacoes/{id}/reservar`).

    ## Desligamento, emergência e canais
    - Chave geral e por fluxo (`/estado`). Com ela desligada, só as operações que **criam efeito novo**
      devolvem 423 (`x-desligamento: recusa`): reservar, recebimentos, entradas, mensagens do assistente
      e ferramentas de preparação. `resultado`, `entrega` e `excecoes` são **sempre aceitos**
      (`x-desligamento: aceita`), porque registram fatos que já aconteceram — desligar no meio de um
      incidente não pode apagar o registro de quem recebeu qual link. Leituras continuam 200.
    - **Modo emergência por token**: o administrador marca um token como em emergência (ou o revoga);
      ele passa a receber 401 em todas as rotas, inclusive leituras. Roteiro de incidente: revogar o
      token, revogar em massa os `LinkAcesso` emitidos no período, trocar o segredo HMAC dos eventos.
    - Canais: `/estado.canais` diz se cada canal de saída está `ligado`, `desligado` ou `bloqueado`.
      `bloqueado` ≠ `desligado`: só muda por configuração versionada acompanhada de ADR que registre a
      elegibilidade. No piloto independente, `whatsapp` começa `desligado` e pode ser ligado
      no LAB dedicado após o aceite; bloqueio policial só pertence ao cenário institucional
      histórico — `../whatsapp-viabilidade.md`. Reservar uma
      comunicação ou receber um arquivo por canal `bloqueado` → 409 `canal_bloqueado`.

    ## Ambientes
    - O token de produção não funciona em treinamento, preview ou teste, e vice-versa (401).
    - Fora de produção — em especial no PREVIEW (DEMO, entrada sem senha) — o canal de e-mail é
      **simulado**: o PCPR não sobe com SMTP ou credencial real configurados, e a instância n8n do
      ambiente não tem credencial real de SMTP nem de IMAP. Aceite: no PREVIEW, uma comunicação
      "enviada" não abre conexão SMTP.
    - A API não é publicada no nginx público: aceita só a rede Docker do n8n (e o próprio host).

    ## Outras regras
    - `X-PCPR-Correlacao` é ecoado e gravado nos logs dos dois lados.
    - Concorrência limitada por token (2–3 chamadas simultâneas) → 429 `limite_excedido` com
      `Retry-After`.
    - Respostas de erro seguem `Erro` (mensagem em português dizendo como resolver).
    - Campos de texto livre que o n8n envia (`detalhe`, `erro`) são gravados com URLs, e-mails e tokens
      mascarados.
    - Evolução: mudanças aditivas (rota, campo opcional, valor de enum) entram no v1; o cliente ignora
      campos que não conhece. Remover ou mudar o significado de algo cria `/api/automacao/v2`.

    ## Unificações de nome feitas no rascunho 3
    | Antes (fluxo) | Fica | Motivo |
    |---|---|---|
    | `oficio_disponivel` (rascunho 2) e `documentos_disponiveis` (10-2) | `documentos_disponiveis` | cobre ofício, termos, OS e plano; o contrato ainda não foi implementado |
    | `aviso_substituicao` (10-2) e `documentos_substituidos` (10-5) | `aviso_substituicao` | mesmo significado ("o que você recebeu foi substituído"); paralelo a `aviso_cancelamento` |
    | `regra_violada` (protótipo) e `ainda_nao_devida` (10-3) para reserva antecipada | `ainda_nao_devida` (409, com `disponivel_em`) | código próprio permite ao n8n encerrar sem exceção; `regra_violada` fica para as demais regras de negócio |
    | `integracao_indisponivel` (rascunho 2) e `integracao_inexistente` (13) | os dois, com significados distintos | `integracao_indisponivel` = existe e está fora do ar (503, repetir depois); `integracao_inexistente` = não há integração oficial (501, não repetir) |
    | chave de recebimento "canal + id da mensagem" (rascunho 2) e `recebimento:whatsapp:<id>` (protótipo) | `receb:<canal>:<mensagem_id_canal>:<anexo_indice>` (10-6 E1) | uma mensagem pode ter vários anexos |
    | `resposta_ao_remetente` no `Recebimento` | marcado como obsoleto | o texto passa a ser a comunicação `resposta_recebimento` (10-6 E6) |

    ## Extensões ainda pendentes (não consolidadas aqui)
    | Extensão | Origem | Por quê |
    |---|---|---|
    | Esquemas de entrada e saída de cada ferramenta (`viagens.*`, `prestacao.*`, `planos.*`, `textos.*`, `protocolo.*`, `central.*`, `meu.*`) | 10-1 §6.3, 10-5 §6.3, 11-1 §6.3, 11-2 §6.3, 11-3 §6.3, 13 §6.5 | ficam no registro de ferramentas (ADR 0020), servidos por `GET /ferramentas`, não neste arquivo |
    | Rotas públicas do link de km (`/km/<token>/…`) e do portal (`/meus-documentos/`, `/p/assinatura/`, `/p/relato/`) | 10-4 §6.4, 10-2 X11, 10-5 §6.3 | são páginas do PCPR com sessão ou link, não API de automação |
    | Corpos e caminhos das operações do eProtocolo | 13 §6.2 | "DESCONHECIDO" até a documentação restrita do credenciamento |
servers:
  - url: https://{host}/api/automacao/v1
    description: Alcançável só pela rede interna do n8n; não publicado no nginx público.
    variables:
      host: { default: pcpr.example.invalid }
security:
  - tokenServico: []
  - tokenPessoal: []
tags:
  - name: controle
  - name: comunicacoes
  - name: recebimentos
  - name: entradas
  - name: assistente
  - name: excecoes
  - name: ferramentas
paths:
  /estado:
    get:
      tags: [controle]
      summary: Chave geral da automação, fluxos, canais e integrações
      operationId: obterEstado
      x-escopos: [estado:ler]
      x-desligamento: aceita
      responses:
        "200":
          description: Estado atual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EstadoAutomacao" }
              examples:
                producao:
                  externalValue: exemplos/estado-automacao.json
        "401": { $ref: "#/components/responses/NaoAutenticado" }
  /comunicacoes:
    get:
      tags: [comunicacoes]
      summary: "[novo] Acha a comunicação pelo id da mensagem no provedor (status de entrega sem referência própria)"
      description: |
        Status de entrega que chega do provedor só com o id da mensagem (no WhatsApp, sem
        `biz_opaque_callback_data`): o n8n descobre a comunicação para chamar
        `POST /comunicacoes/{id}/entrega`. Resposta mínima — id e versão, sem destino, conteúdo nem
        dado pessoal. Lista vazia = nenhum resultado com esse `provedor_mensagem_id` foi registrado
        **ainda** (o status pode chegar antes do `POST …/resultado`): o n8n responde não-2xx ao
        provedor para ele reentregar o status depois, em vez de descartá-lo.
      operationId: buscarComunicacaoPorMensagemDoProvedor
      x-origem: "protótipo WA-3 (W8; apontamento C10 da revisão do PR #23)"
      x-escopos: [comunicacoes:ler]
      x-desligamento: aceita
      parameters:
        - name: provedor_mensagem_id
          in: query
          required: true
          description: "Id devolvido pelo canal no envio e registrado em `resultado` (ex.: wamid)."
          schema: { type: string, minLength: 1, maxLength: 300 }
      responses:
        "200":
          description: Zero ou uma comunicação
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [itens]
                properties:
                  itens:
                    type: array
                    maxItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, versao]
                      properties:
                        id: { type: integer, minimum: 1 }
                        versao: { type: integer, minimum: 1 }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Negado" }
        "422": { $ref: "#/components/responses/EntradaInvalida" }
  /comunicacoes/devidas:
    get:
      tags: [comunicacoes]
      summary: Comunicações cujo horário chegou e que ainda não foram reservadas (reconciliação)
      description: |
        Caminho de segurança do modelo "push + pull": o PCPR avisa por evento quando agenda algo; o n8n
        também consulta esta lista a cada 15 min para não perder nada se um evento se perder ou o n8n
        reiniciar. Consulta indexada (estado, enviar_em); custo desprezível.
      operationId: listarDevidas
      x-escopos: [comunicacoes:ler]
      x-desligamento: aceita
      parameters:
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - name: tipo
          in: query
          description: "Filtra por tipo de comunicação (repetível). [novo] — x-origem: 10-4 §6.2"
          schema: { type: array, items: { $ref: "#/components/schemas/TipoComunicacao" } }
          style: form
          explode: true
        - name: fluxo
          in: query
          description: "Filtra pelo fluxo dono da comunicação. [novo]"
          schema: { type: string, pattern: "^[a-z0-9-]{1,64}$" }
      responses:
        "200":
          description: Lista (pode ser vazia)
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens: { type: array, items: { $ref: "#/components/schemas/ComunicacaoResumo" } }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Negado" }
  /comunicacoes/{id}:
    get:
      tags: [comunicacoes]
      summary: "[novo] Situação de uma comunicação (o n8n consulta antes de abrir exceção depois de reiniciar)"
      operationId: obterComunicacao
      x-origem: 10-2 X8
      x-escopos: [comunicacoes:ler]
      x-desligamento: aceita
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Situação, sem destino nem conteúdo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComunicacaoSituacao" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Negado" }
        "404": { description: Comunicação inexistente ou fora do escopo do token }
  /comunicacoes/{id}/reservar:
    post:
      tags: [comunicacoes]
      summary: Revalida e reserva uma comunicação para envio (lease)
      description: |
        O PCPR revalida TUDO antes de liberar o conteúdo: comunicação não cancelada, versão da viagem e do
        documento iguais às da comunicação, destinatário ainda autorizado e com contato verificado, canal
        `ligado` (não `desligado` nem `bloqueado`), horário já devido, automação ligada. Passa
        `agendada → enviando` com prazo de reserva (10 min). Duas reservas simultâneas: só uma ganha.
        Se a reserva vencer sem resultado, a comunicação vai para `resultado_desconhecido` e para a fila
        de exceções (não reenvia às cegas). Toda retentativa do n8n precisa caber nos 10 min.

        Respostas 409 (corpo `Erro`): `obsoleta` (cancelada ou substituída), `conflito_de_versao`
        (`X-PCPR-Versao-Esperada` diferente da atual), `ja_processada` (já reservada, enviada ou
        encerrada), `ainda_nao_devida` (antes de `enviar_em`; traz `disponivel_em`), `suspensa` (ofício
        reaberto ou recebimento em conferência), `canal_bloqueado`, `regra_violada` (outras regras).
      operationId: reservarComunicacao
      x-escopos: [comunicacoes:reservar]
      x-desligamento: recusa
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            ÚNICA POR TENTATIVA: `reserva:<comunicacao>:v<versao>:exec<id da execução>` — estável dentro
            da execução, diferente entre execuções. Motivo (análise do protótipo): com uma chave estável
            sem a execução, uma segunda execução (evento + reconciliação ao mesmo tempo, ou reentrega que
            escapou da deduplicação) receberia a resposta guardada da primeira, com o mesmo token de
            reserva, e enviaria de novo. A exclusividade vem da transição `agendada → enviando`; o T2c do
            protótipo (evento com outro id → 409 `ja_processada`) falharia com chave estável.
          schema: { type: string, minLength: 16, maxLength: 200 }
        - name: X-PCPR-Versao-Esperada
          in: header
          required: false
          description: Versão da comunicação que o chamador viu no evento; diferente da atual → 409 `conflito_de_versao`.
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/Correlacao"
      responses:
        "200":
          description: Reservada; conteúdo pronto para o canal
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComunicacaoReservada" }
              examples:
                documentos:
                  externalValue: exemplos/reserva-documentos-disponiveis.json
                linkKm:
                  externalValue: exemplos/reserva-link-km.json
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Negado" }
        "409":
          description: Não enviar (ver os códigos na descrição)
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
              examples:
                obsoleta:
                  externalValue: exemplos/erro-reserva-obsoleta.json
        "423": { $ref: "#/components/responses/Desligada" }
        "429": { $ref: "#/components/responses/LimiteExcedido" }
  /comunicacoes/{id}/resultado:
    post:
      tags: [comunicacoes]
      summary: Registra o resultado do envio no canal (aceito mesmo com a automação desligada)
      operationId: registrarResultado
      x-escopos: [comunicacoes:resultado]
      x-desligamento: aceita
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Correlacao"
      requestBody:
        required: true
        description: "`Idempotency-Key`: `resultado:<comunicacao>:<token da reserva>`."
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResultadoEnvio" }
            examples:
              enviada:
                externalValue: exemplos/resultado-envio.json
      responses:
        "200":
          description: Registrado (repetição devolve o mesmo registro)
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Negado" }
        "409":
          description: Reserva de outra execução, ou comunicação já encerrada com outro resultado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "429": { $ref: "#/components/responses/LimiteExcedido" }
  /comunicacoes/{id}/entrega:
    post:
      tags: [comunicacoes]
      summary: Status de entrega informado pelo provedor (entregue/lida/falhou), repassado pelo n8n
      operationId: registrarEntrega
      x-escopos: [comunicacoes:entrega]
      x-desligamento: aceita
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        description: "`Idempotency-Key`: `entrega:<comunicacao>:<provedor_mensagem_id>:<status>`."
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provedor_mensagem_id, status, ocorrido_em]
              properties:
                provedor_mensagem_id: { type: string, maxLength: 300 }
                status: { type: string, enum: [entregue, lida, falhou] }
                ocorrido_em: { type: string, format: date-time }
                erro: { type: string, maxLength: 2000, description: "gravado com URLs, e-mails e tokens mascarados" }
      responses:
        "200":
          description: Registrado; status nunca regride (lida não volta a entregue)
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Negado" }
        "429": { $ref: "#/components/responses/LimiteExcedido" }
  /recebimentos:
    post:
      tags: [recebimentos]
      summary: Entrega ao PCPR um arquivo devolvido por um canal (entra na importação documental existente)
      description: |
        Não classifica nem lê o arquivo: cria um `ArquivoImportado` pela importação documental que o
        sistema já tem (OCR, identificação, distribuição, revisão), em nome do servidor vinculado ao
        contato. Contato não verificado → quarentena para conferência humana, nada é aplicado.

        `Idempotency-Key` = `receb:<canal>:<mensagem_id_canal>:<anexo_indice>` (10-6 E1); quando isso
        passaria de 200 caracteres (o id do canal aceita até 300), `receb#sha256:<canal>:<hex do
        SHA-256 do mensagem_id_canal>:<anexo_indice>` (o `#` no 1º segmento impede que um id curto
        reproduza essa forma). Repetir a
        mesma chave devolve o mesmo `Recebimento` sem efeito; **mesma chave com SHA-256 diferente →
        409 `conflito_de_versao`** (o canal mudou o anexo; vira exceção), em vez do 422 genérico. Mesmo
        SHA-256 no mesmo destino com outra chave = `duplicado`. O PCPR recalcula o SHA-256 e recusa com
        422 `entrada_invalida` se divergir do informado.

        `canal=portal` não existe aqui: o portal é interno ao PCPR e não usa token de serviço (10-6 E1).
        Canal `bloqueado` em `/estado.canais_entrada` → 409 `canal_bloqueado`. Com a chave desligada →
        423 (não guardado): a mensagem continua na caixa postal até a religação, nada se perde.
        A rota entra em `LIMITES_DO_CORPO_POR_CAMINHO` com 26 MiB (senão o middleware devolve 413 a
        partir de 16 MiB).
      operationId: criarRecebimento
      x-escopos: [recebimentos:criar]
      x-desligamento: recusa
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo, canal, mensagem_id_canal, anexo_indice, total_anexos, remetente, recebido_em, sha256]
              properties:
                arquivo: { type: string, format: binary, description: "até 25 MiB (limite da importação)" }
                canal: { type: string, enum: [email, whatsapp], description: "canal bloqueado responde 409; piloto WhatsApp inicia desligado e depende do aceite no LAB" }
                mensagem_id_canal: { type: string, maxLength: 300, description: "Message-ID do e-mail" }
                anexo_indice: { type: integer, minimum: 0, description: "[novo] posição do anexo na mensagem; parte da chave — x-origem: 10-6 E1" }
                total_anexos: { type: integer, minimum: 1, description: "[novo] permite consolidar uma resposta por mensagem — x-origem: 10-6 E1" }
                nome_arquivo: { type: string, maxLength: 255, description: "[novo] nome original — x-origem: 10-6 E1" }
                remetente: { type: string, maxLength: 320, description: "endereço no canal" }
                recebido_em: { type: string, format: date-time }
                sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
                em_resposta_a_comunicacao: { type: integer, description: "quando o n8n já sabe a comunicação respondida" }
                em_resposta_a_mensagem_canal: { type: string, maxLength: 998, description: "[novo] In-Reply-To/References; o PCPR resolve para a Comunicacao pelo provedor_mensagem_id — x-origem: 10-6 E1" }
                autenticacao_remetente:
                  type: object
                  description: "[novo] cópia do cabeçalho Authentication-Results da caixa institucional — x-origem: 10-6 E1"
                  additionalProperties: false
                  properties:
                    spf: { type: string, enum: [pass, fail, none] }
                    dkim: { type: string, enum: [pass, fail, none] }
                    dmarc: { type: string, enum: [pass, fail, none] }
                gerada_automaticamente: { type: boolean, description: "[novo] Auto-Submitted, Precedence, List-Id, MAILER-DAEMON: o PCPR não agenda resposta — x-origem: 10-6 E1" }
                assunto: { type: string, maxLength: 200, description: "[novo] mostrado ao revisor, nunca usado na identificação — x-origem: 10-6 E1" }
                texto_mensagem: { type: string, maxLength: 2000, description: "[novo] opcional (decisão D9 do 10-6); dado, nunca instrução; não vai para IA — x-origem: 10-6 E1" }
            encoding:
              autenticacao_remetente: { contentType: application/json }
      responses:
        "202":
          description: Aceito para processamento (ou reconhecido como duplicado)
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recebimento" }
              examples:
                aceito:
                  externalValue: exemplos/recebimento-aceito.json
                duplicado:
                  externalValue: exemplos/recebimento-duplicado.json
                quarentena:
                  externalValue: exemplos/recebimento-quarentena.json
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/Negado" }
        "409":
          description: "`conflito_de_versao` (mesma chave, outro SHA-256) ou `canal_bloqueado`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "413": { description: "Acima do limite; usar `/recebimentos/sem-arquivo` e orientar o remetente a enviar pelo portal" }
        "422": { $ref: "#/components/responses/EntradaInvalida" }
        "423": { $ref: "#/components/responses/Desligada" }
        "429": { $ref: "#/components/responses/LimiteExcedido" }
  /recebimentos/sem-arquivo:
