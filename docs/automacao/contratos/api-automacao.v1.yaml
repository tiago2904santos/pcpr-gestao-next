                canal: { type: string, enum: [email, whatsapp] }
                mensagem_id_canal: { type: string, maxLength: 300 }
                anexo_indice: { type: integer, minimum: 0 }
                total_anexos: { type: integer, minimum: 1 }
                remetente: { type: string, maxLength: 320 }
                recebido_em: { type: string, format: date-time }
                nome_arquivo: { type: string, maxLength: 255 }
                tamanho: { type: integer, minimum: 0, description: "bytes informados pelo canal" }
                motivo: { type: string, enum: [acima_do_limite, sem_anexo, nao_baixado] }
      responses:
        "202":
          description: Registrado
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
