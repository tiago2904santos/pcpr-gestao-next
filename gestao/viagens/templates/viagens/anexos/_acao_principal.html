{% with l=servidor_atual ps=servidor_atual.ps %}{% if l.editavel and not ps.finalizada and not ps.arquivada %}{% if l.pendencias %}<a class="botao botao--primario" href="#finalizar">Finalizar prestação</a>{% else %}<button type="submit" form="form-ps-{{ ps.pk }}" formaction="{% url 'viagens:acao_prestacao' ps.pk 'finalizar' %}" class="botao botao--primario">{% icone "check" %}Finalizar prestação</button>{% endif %}{% elif l.editavel and ps.finalizada and ps.situacao != "aprovada" and ps.situacao != "enviada" %}<button type="submit" form="form-ps-{{ ps.pk }}" formaction="{% url 'viagens:acao_prestacao' ps.pk 'reabrir' %}" class="botao">{% icone "undo-2" %}Reabrir prestação</button>{% endif %}{% endwith %}
