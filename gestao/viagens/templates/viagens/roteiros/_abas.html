{# Abas da lista de roteiros (como no sistema de referência); preservam a busca. OOB na busca ao vivo. #}
<nav class="abas" id="abas-filtro" aria-label="Filtrar roteiros"{% if oob %} hx-swap-oob="true"{% endif %}>
  {% for chave, rotulo, contador in abas %}
    <a class="aba" href="?{% if chave %}aba={{ chave }}&{% endif %}{% if termo %}q={{ termo|urlencode }}{% endif %}"{% if chave == aba %} aria-current="page"{% endif %}>
      {{ rotulo }} <span class="aba__contagem">{{ contagens|get_item:contador }}</span>
    </a>
  {% endfor %}
</nav>
