{% comment %}Formulário de remover a via (fora de qualquer outro <form>: as folhas são um formulário só); o item de menu aponta para ele com form="remover-via-<pk>".{% endcomment %}
<form id="remover-via-{{ s.via.pk }}" method="post" action="{% url 'viagens:remover_via_assinada' s.via.pk %}" hidden data-confirmar="A via assinada sai de uso e o PDF gerado volta a valer. O arquivo fica guardado no histórico." data-confirmar-titulo="Remover a via assinada de {{ titulo }}?" data-confirmar-rotulo="Remover via assinada" data-confirmar-perigo>{% csrf_token %}<input type="hidden" name="voltar" value="{{ voltar }}"></form>
