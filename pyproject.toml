[project]
name = "pcpr-gestao"
version = "0.1.0"
description = "Gestão de Eventos Sociais e Central de Viagens — PCPR (nova implementação)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi>=25",
    "django==6.1.*",
    "django-htmx>=1.29",
    "gunicorn>=26",
    "pikepdf>=10",
    "psycopg[binary]>=3.3",
    "weasyprint>=70",
    "whitenoise>=6.12",
]

[dependency-groups]
dev = [
    "bandit>=1.9",
    "django-stubs>=6.1",
    "hypothesis>=6",
    "import-linter>=2.15",
    "mypy>=2.3",
    "pip-audit>=2.10",
    "playwright==1.56.0",
    "pytest>=9",
    "pytest-cov>=7",
    "pytest-django>=4.14",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "SIM", "RUF", "PTH", "C4", "T20"]
ignore = ["S101", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311"]
"tests/**" = ["S105", "S106", "S311", "T20"]
"tests/e2e/**" = ["S105", "S106", "S311", "T20", "E501"]
"scripts/**" = ["T20", "S603", "S607"]
# Tabela de cenários e HTML da galeria: uma linha por cenário é mais legível que quebrar.
"scripts/evidencias_visuais.py" = ["T20", "S603", "S607", "E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["gestao", "tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: navegação real no navegador (Playwright)",
    "visual: capturas de tela em larguras de referência",
    "a11y: verificação automática com axe-core",
    "perf: orçamentos de desempenho",
]

[tool.coverage.run]
source = ["gestao"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations/", "tests/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.importlinter]
root_package = "gestao"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Plataforma não depende de contextos de negócio"
type = "forbidden"
source_modules = ["gestao.plataforma"]
forbidden_modules = ["gestao.viagens", "gestao.cadastros", "gestao.painel", "gestao.identidade"]
ignore_imports = ["gestao.plataforma.tests.** -> gestao.**"]

[[tool.importlinter.contracts]]
name = "Regras de domínio puras não dependem do Django"
type = "forbidden"
source_modules = ["gestao.viagens.dominio"]
forbidden_modules = ["django"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Cadastros não dependem de Viagens"
type = "forbidden"
source_modules = ["gestao.cadastros"]
forbidden_modules = ["gestao.viagens", "gestao.painel"]

[[tool.importlinter.contracts]]
name = "Identidade é base: não depende de outros contextos"
type = "forbidden"
source_modules = ["gestao.identidade"]
forbidden_modules = ["gestao.viagens", "gestao.cadastros", "gestao.painel"]
