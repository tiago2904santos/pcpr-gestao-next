# Proxy reverso COMPARTILHADO (Caddy: HTTPS automático Let's Encrypt) — use SÓ se a VPS não
# tiver outro proxy nas portas 80/443. Havendo Nginx/Traefik, integre com nginx-site.conf.modelo.
#   docker compose -f /srv/pcpr/infra/deploy/proxy/compose.yml --env-file /etc/pcpr/proxy/proxy.env up -d
# Um site por instância em /etc/pcpr/proxy/sites/<instância>.caddy (modelo: site.caddy.modelo).
name: pcpr-proxy

services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    # Rede do host: alcança as instâncias em 127.0.0.1:<porta> e escuta 80/443 (TCP e UDP/HTTP3).
    network_mode: host
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?e-mail para avisos do Let's Encrypt}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${PCPR_PROXY_SITES:-/etc/pcpr/proxy/sites}:/etc/caddy/sites:ro
      - ${PCPR_PROXY_DADOS:-/srv/pcpr/proxy}/data:/data
      - ${PCPR_PROXY_DADOS:-/srv/pcpr/proxy}/config:/config
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
