{% load viagens %}
{# Painel compartilhado da preparação: mapa proporcional e legenda no mesmo bloco. #}
<section class="itin__bloco itin__painel" aria-label="Rota">
  <div class="itin__rota">
    <div class="itin__mapa" data-mapa>
      <p class="itin__mapa-vazio" data-mapa-vazio>{% icone "map" %}O mapa traça a rota assim que houver a sede e um destino.</p>
    </div>
    <button type="button" class="botao botao--sm itin__ver-rota" data-ver-rota hidden>{% icone "route" classe="icone--sm" %}Ver a rota inteira</button>
  </div>
  <div class="itin__metricas">
    <p class="itin__totais" data-totais role="status">
      <span class="itin__total">{% icone "arrow-right" classe="icone--sm" %}<span class="itin__total-rotulo">Ida</span><span class="itin__total-valor" data-ida-km>—</span><span class="itin__total-valor" data-ida-tempo>—</span></span>
      <span class="itin__total">{% icone "undo-2" classe="icone--sm" %}<span class="itin__total-rotulo itin__so-destinos">Ida e volta</span><span class="itin__total-rotulo itin__so-bv">Volta</span><span class="itin__total-valor" data-total-km>—</span><span class="itin__total-valor" data-total-tempo>—</span></span>
    </p>
  </div>
</section>
