<dialog class="dialogo" id="dialogo-fila-downloads" aria-labelledby="fila-titulo">
  <div class="dialogo__cabecalho"><h2 id="fila-titulo">Downloads</h2><button class="botao botao--icone botao--sutil" data-fechar-dialogo aria-label="Fechar" type="button">{% icone "x" %}</button></div>
  <div class="dialogo__corpo pilha"><p class="texto-secundario">Até três arquivos são preparados ao mesmo tempo. Se solicitado, permita vários downloads deste site. Aguarde a fila terminar antes de sair da página.</p><p role="status" data-fila-status></p><ol class="pilha" data-fila-itens></ol></div>
  <div class="dialogo__rodape"><button class="botao" type="button" data-fila-cancelar>Parar fila</button><button class="botao" type="button" data-fechar-dialogo>Fechar</button></div>
</dialog>
